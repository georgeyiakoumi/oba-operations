<script>
/* ══════════════════════════════════════════════════════
   SIDEBAR  (always-visible subnav, no collapse)
══════════════════════════════════════════════════════ */
function renderSidebar(){
  var refs=DATA.referrals||[];
  var v=STATE.view;

  /* Counts */
  var refCount=refs.filter(isReferral).length;
  var triageCount=refs.filter(isNewRef).length;
  var inProgCount=refs.filter(isRegAppt).length;
  var waitListCount=refs.filter(isWaitingList).length;
  var benCount=refs.filter(isBeneficiary).length;
  var closedCount=refs.filter(isClosed).length;
  var wbCount=(DATA.actions||[]).filter(function(a){return a.status!=='done';}).length;

  /* Active-state groups */
  var dashViews=['dashboard','today','overview'];
  var refViews=['allReferrals','newReferrals','awaitingTriage','inProgress','waitingList','registrations','onlinePending','detail'];
  var wbViews=['wellbeing'];

  var h='<div class="brand-card"><svg width="28" height="28" viewBox="0 0 30 30" fill="none"><circle cx="15" cy="15" r="13" stroke="#6f9a2a" stroke-width="1.6"/><ellipse cx="11" cy="17" rx="4" ry="2.2" transform="rotate(-40 11 17)" fill="#6f9a2a"/><ellipse cx="18" cy="11" rx="4" ry="2.2" transform="rotate(-40 18 11)" fill="#a7c74a"/></svg><div><div class="logo-text">Olive Branch Aid</div><div class="logo-sub">more than a food bank</div></div></div>';
  h+='<div class="ops-label">OPERATIONS SUITE</div>';

  /* Dashboard */
  h+=sideBtn('dashboard','Dashboard','layout-dashboard',null,dashViews.indexOf(v)>=0);

  /* Referrals + subnav */
  var refActive=refViews.indexOf(v)>=0;
  h+=sideBtn('ref','Referrals','folder-open',refCount,refActive);
  h+='<div class="subnav">';
  h+=subBtn('awaitingTriage','New Referrals',triageCount,v==='awaitingTriage'||v==='newReferrals');
  h+=subBtn('inProgress','Reg. Appointments',inProgCount,v==='inProgress'||v==='registrations'||v==='onlinePending'||v==='detail');
  h+=subBtn('waitingList','Waiting List',waitListCount,v==='waitingList');
  h+='</div>';

  /* Beneficiaries (top-level) */
  h+=sideBtn('ben','Beneficiaries','users',benCount,v==='ben');

  /* Closed (top-level) */
  h+=sideBtn('closed','Closed','x-circle',closedCount,v==='closed');

  /* Wellbeing + subnav */
  var wbActive=wbViews.indexOf(v)>=0;
  h+=sideBtn('wb','Wellbeing','heart-handshake',wbCount>0?wbCount:null,wbActive);
  h+='<div class="subnav">';
  h+=subBtn('wbAllCases','All Cases',null,v==='wellbeing'&&!STATE.wbRef&&STATE.wbMainTab===1);
  h+=subBtn('wbTodo','To-do / Notes',null,v==='wellbeing'&&!STATE.wbRef&&STATE.wbMainTab===2);
  h+='</div>';

  h+='<div class="side-foot"><span>OBA Ops v1.0</span>'+(DATA.sheetUrl?'<a href="'+DATA.sheetUrl+'" target="_blank" rel="noopener">sheet ↗</a>':'')+'</div>';
  document.getElementById('sidebar').innerHTML=h;
}
function sideBtn(key,lbl,iconName,badge,active){
  return '<button class="nav-item'+(active?' active-parent':'')+'" onclick="sideNav(\''+key+'\')"><span class="nav-ic">'+ic(iconName||'ref',16)+'</span><span class="nav-lbl">'+lbl+'</span>'+(badge?'<span class="nav-badge">'+badge+'</span>':'')+'</button>';
}
function subBtn(key,lbl,badge,active){
  return '<button class="'+(active?'active':'')+'" onclick="sideNav(\''+key+'\')">'+lbl+(badge?'<span class="sub-badge">'+badge+'</span>':'')+'</button>';
}
function sideNav(key){
  if(key==='dashboard') return go('dashboard');
  if(key==='ref') return go('allReferrals');
  if(key==='awaitingTriage') return go('newReferrals');
  if(key==='inProgress') return go('registrations');
  if(key==='waitingList') return go('waitingList');
  if(key==='closed') return go('closed');
  if(key==='wb'){STATE.wbMainTab=0;STATE.wbRef=null;return go('wellbeing');}
  if(key==='wbAllCases'){STATE.wbMainTab=1;STATE.wbRef=null;return go('wellbeing');}
  if(key==='wbTodo'){STATE.wbMainTab=2;STATE.wbRef=null;return go('wellbeing');}
  go(key);
}
function go(view,ref){STATE.view=view;if(ref)STATE.ref=ref;if(view==='detail'){STATE.step=1;STATE.wtab=1;}render();window.scrollTo(0,0);}

/* ══════════════════════════════════════════════════════
   DASHBOARD  (tabbed: Overview | Actions)
══════════════════════════════════════════════════════ */
function renderToday(){return renderDashboard();}
function renderOverview(){return renderDashboard();}

function renderDashboard(){
  var refs=DATA.referrals||[];
  var today=new Date();
  var todayStr=today.toISOString().slice(0,10);

  var h='<h1 style="margin-bottom:8px">Dashboard</h1>';

  /* Tab bar with week nav integrated (health-bank style) */
  h+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap">';
  h+='<div class="dash-tabs" style="margin-bottom:0">';
  h+='<button class="dash-tab'+(STATE.dashTab===0?' on':'')+'" onclick="STATE.dashTab=0;render()">Overview</button>';
  h+='<button class="dash-tab'+(STATE.dashTab===1?' on':'')+'" onclick="STATE.dashTab=1;render()">Actions</button>';
  h+='</div>';

  /* Week nav (only visible on Actions tab) */
  if(STATE.dashTab===1){
    var now2=new Date();var dow=now2.getDay();var moff=dow===0?-6:1-dow;
    var ws=new Date(now2);ws.setDate(now2.getDate()+moff+(STATE.weekOffset*7));
    var we=new Date(ws);we.setDate(ws.getDate()+6);
    var wfmt=function(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});};
    h+='<div class="week-picker" style="margin-bottom:0">';
    h+='<button class="wp-nav" onclick="STATE.weekOffset--;render()">'+ic('chevron-left',16)+'</button>';
    h+='<span class="wp-label">'+wfmt(ws)+' – '+wfmt(we)+'</span>';
    h+='<button class="wp-nav" onclick="STATE.weekOffset++;render()">'+ic('chevron-right',16)+'</button>';
    if(STATE.weekOffset!==0)h+='<button class="wp-today" onclick="STATE.weekOffset=0;STATE.selectedDay=\''+todayStr+'\';render()">Today</button>';
    h+='</div>';
  }
  h+='</div>';

  if(STATE.dashTab===0) h+=renderDashOverview(refs,todayStr);
  else h+=renderDashActions(refs,todayStr);
  return h;
}

/* closingIn helper — used by both Overview and Actions */
function closingIn(month,year){
  return (DATA.referrals||[]).filter(function(r){
    if(!r.openTo||BENEFICIARY_STATUSES.indexOf(r.status)<0)return false;
    return r.openTo.indexOf(month)===0&&r.openTo.indexOf(year+'')>0;
  });
}

/* ── Overview tab ── */
function renderDashOverview(refs,todayStr){
  var h='';
  var actions=(DATA.actions||[]).filter(function(a){return a.status!=='done';});
  var overdue=actions.filter(function(a){return a.dueBy&&a.dueBy<todayStr;});

  /* Overdue alert */
  if(overdue.length){
    h+='<div class="alert-banner"><div class="ah">'+ic('warn',16)+overdue.length+' overdue task'+(overdue.length>1?'s':'')+' need attention</div>';
    overdue.forEach(function(a){h+='<div class="ar"><b>'+esc(a.ref)+'</b> — '+esc(a.name)+': '+esc(a.action)+' <span style="color:var(--red);font-size:11.5px">Due '+fmtDate(a.dueBy)+'</span></div>';});
    h+='</div>';
  }

  /* Pipeline cards */
  function pcount(pipe){return refs.filter(function(r){return statusMeta(r.status).pipe===pipe;}).length;}
  var now=new Date();
  var dueToCloseCount=closingIn(MONTHS[now.getMonth()],now.getFullYear()).length+closingIn(MONTHS[(now.getMonth()+1)%12],(now.getMonth()+1)%12===0?now.getFullYear()+1:now.getFullYear()).length;
  var taskCount=(DATA.actions||[]).filter(function(a){return a.status!=='done';}).length;
  var benTotal=refs.filter(isBeneficiary).length;

  h+='<div class="pipeline" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">';
  /* Active Beneficiaries — first */
  h+='<div class="pcard pt-green" onclick="go(\'ben\')" style="cursor:pointer"><div class="pc-icon">'+ic('users',20)+'</div><div class="num">'+benTotal+'</div><div class="lab">Active Beneficiaries</div></div>';
  /* Standard pipeline */
  var pipe=[
    ['New','New Referrals','pt-green','user-plus','newReferrals'],
    ['Reg. Appointments','Reg. Appointments','pt-orange','calendar','registrations'],
    ['Waiting List','Waiting List','pt-dark','clipboard-check','waitingList'],
    ['Waiting for Delivery','Awaiting Delivery','pt-plum','truck','']
  ];
  pipe.forEach(function(p){
    var cnt=pcount(p[0]);
    var clickAttr=p[4]?' onclick="go(\''+p[4]+'\')" style="cursor:pointer"':'';
    h+='<div class="pcard '+p[2]+'"'+clickAttr+'><div class="pc-icon">'+ic(p[3],20)+'</div><div class="num">'+cnt+'</div><div class="lab">'+p[1]+'</div></div>';
  });
  if(dueToCloseCount>0){
    h+='<div class="pcard pt-red"><div class="pc-icon">'+ic('alert-circle',20)+'</div><div class="num">'+dueToCloseCount+'</div><div class="lab">Due to Close</div></div>';
  }
  /* Outstanding Tasks — last */
  h+='<div class="pcard pt-plum" onclick="STATE.dashTab=1;render()" style="cursor:pointer"><div class="pc-icon">'+ic('check-square',20)+'</div><div class="num">'+taskCount+'</div><div class="lab">Outstanding Tasks</div></div>';
  h+='</div>';

  /* Borough breakdown */
  h+='<div style="margin-bottom:22px">'+boroughBreakdown()+'</div>';

  /* Due to close — two-column (this month + next month) grouped by borough */
  var thisMonth=MONTHS[now.getMonth()];var thisYear=now.getFullYear();
  var nextMonthIdx=(now.getMonth()+1)%12;var nextMonth=MONTHS[nextMonthIdx];
  var nextYear=nextMonthIdx===0?thisYear+1:thisYear;
  var closingThis=closingIn(thisMonth,thisYear);
  var closingNext=closingIn(nextMonth,nextYear);

  function renderClosingCol(list,monthLabel){
    if(!list.length)return '<div class="closing-col"><div class="cc-month">'+monthLabel+'<span class="cc-count">0</span></div><p style="color:var(--faint);font-size:13px">No cases due to close.</p></div>';
    var grouped={};list.forEach(function(r){(grouped[r.borough]=grouped[r.borough]||[]).push(r);});
    var h='<div class="closing-col"><div class="cc-month">'+monthLabel+'<span class="cc-count">'+list.length+'</span></div>';
    ['Lambeth','Southwark','Wandsworth','Croydon'].forEach(function(b){
      var bList=grouped[b];if(!bList)return;
      h+='<div class="cc-borough">'+b+'</div>';
      bList.forEach(function(r){
        h+='<div class="cc-ref" onclick="go(\'detail\',\''+r.ref+'\')"><span class="cc-refnum">'+r.ref.replace('REF-','')+'</span>'+esc(r.name)+'</div>';
      });
    });
    h+='</div>';return h;
  }

  if(closingThis.length||closingNext.length){
    h+='<div class="closing-card"><div class="cc-head">'+ic('calendar-off',18)+'Due to close</div>';
    h+='<div class="closing-cols">';
    h+=renderClosingCol(closingThis,thisMonth+' '+thisYear);
    h+=renderClosingCol(closingNext,nextMonth+' '+nextYear);
    h+='</div></div>';
  }

  return h;
}

/* ── Actions tab (day picker pills + selected day content) ── */
function renderDashActions(refs,todayStr){
  var h='';

  /* Calculate week */
  var now=new Date();var dow=now.getDay();var moff=dow===0?-6:1-dow;
  var weekStart=new Date(now);weekStart.setDate(now.getDate()+moff+(STATE.weekOffset*7));
  var dayNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  /* Day picker pills */
  h+='<div class="day-picker">';
  for(var i=0;i<7;i++){
    var d=new Date(weekStart);d.setDate(weekStart.getDate()+i);
    var dStr=d.toISOString().slice(0,10);
    var isToday=dStr===todayStr;
    var isSelected=dStr===STATE.selectedDay;
    var dayLabel=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});

    /* Count indicators for this day */
    var dayApptCount=refs.filter(function(r){return r.apptDate&&r.apptDate===dStr;}).length;
    var dayCollCount=(DATA.collections||[]).filter(function(c){return c.date===dStr;}).length;
    var dayActionCount=(DATA.actions||[]).filter(function(a){return a.status!=='done'&&a.dueBy&&a.dueBy===dStr;}).length;

    var cls='day-pill'+(isSelected?' selected':'')+(isToday?' today-pill':'');
    h+='<div class="'+cls+'" onclick="STATE.selectedDay=\''+dStr+'\';render()">';
    h+='<div class="dp-name">'+(isToday?'Today':dayNames[i])+'</div>';
    h+='<div class="dp-date">'+dayLabel+'</div>';
    h+='<div class="dp-indicators">';
    if(dayCollCount)h+='<span class="dp-ind" style="color:var(--green)">'+ic('package',11)+dayCollCount+'</span>';
    if(dayApptCount)h+='<span class="dp-ind dp-ind-new">'+ic('calendar',11)+dayApptCount+'</span>';
    if(dayActionCount)h+='<span class="dp-ind dp-ind-action">'+ic('alert-circle',11)+dayActionCount+'</span>';
    h+='</div>';
    h+='</div>';
  }
  h+='</div>';

  /* Appointments for selected day */
  var selAppts=refs.filter(function(r){return r.apptDate&&r.apptDate===STATE.selectedDay;});
  selAppts.sort(function(a,b){return(a.apptTime||'').localeCompare(b.apptTime||'');});
  var selDate=new Date(STATE.selectedDay+'T00:00:00');
  var selLabel=selDate.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});

  h+='<div class="card" style="padding:0;overflow:hidden;margin-bottom:20px">';
  h+='<div style="padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between">';
  h+='<h2 style="margin:0;display:flex;align-items:center;gap:8px">Appointments <span class="nav-badge">'+selAppts.length+'</span></h2>';
  if(selAppts.length)h+='<button class="btn btn-ghost" onclick="window.print()" style="font-size:12px;padding:6px 12px">'+ic('print',13)+' Print</button>';
  h+='</div>';
  if(!selAppts.length){
    h+='<div style="padding:30px;text-align:center;color:var(--muted);font-size:14px">No appointments scheduled for '+selLabel+'.</div>';
  } else {
    h+='<table class="rtable"><thead><tr><th>Time</th><th>Name</th><th>Type</th><th>Volunteer</th><th></th></tr></thead><tbody>';
    selAppts.forEach(function(r){
      var aptType=r.apptType==='online'?'Online registration':isComplex(r)?'WB Follow-up':'New registration';
      h+='<tr onclick="go(\'detail\',\''+r.ref+'\')">';
      h+='<td style="font-family:var(--font-mono);font-weight:600;color:var(--green-deep)">'+esc(r.apptTime||'—')+'</td>';
      h+='<td><span class="r-name">'+renderFlags(r,{showEmerg:false})+esc(r.name)+'</span></td>';
      h+='<td class="r-muted">'+aptType+'</td>';
      h+='<td class="r-muted">'+esc(r.apptSlot&&r.apptSlot!=='Anyone'?r.apptSlot:'—')+'</td>';
      h+='<td style="color:var(--faint)">'+ic('chevron-right',14)+'</td></tr>';
    });
    h+='</tbody></table>';
  }
  h+='</div>';

  /* Collections for selected day */
  var selColls=(DATA.collections||[]).filter(function(c){return c.date===STATE.selectedDay;});
  selColls.sort(function(a,b){return(a.time||'').localeCompare(b.time||'');});
  if(selColls.length){
    h+='<div class="card" style="padding:0;overflow:hidden;margin-bottom:20px">';
    h+='<div style="padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between">';
    h+='<h2 style="margin:0;display:flex;align-items:center;gap:8px">'+ic('package',16)+'Collections <span class="nav-badge">'+selColls.length+'</span></h2>';
    h+='</div>';
    selColls.forEach(function(c){
      var r=getRef(c.ref);if(!r)return;
      var rowCls='coll-row'+(c.status?' status-'+c.status:'');
      h+='<div class="'+rowCls+'">';
      h+='<span class="coll-time">'+esc(c.time)+'</span>';
      h+='<span class="coll-name" onclick="event.stopPropagation();openBeneFile(\''+c.ref+'\')">'+esc(r.name)+'</span>';
      h+='<span class="coll-meta">'+esc(r.borough)+' · '+esc(r.distributionGroup||'')+'</span>';
      h+='<div class="coll-btns">';
      h+='<button class="coll-btn'+(c.status==='collected'?' coll-btn-collected':'')+'" onclick="markCollection(\''+c.ref+'\',\'collected\')">'+ic('check',13)+' Collected</button>';
      h+='<button class="coll-btn'+(c.status==='dna'?' coll-btn-dna':'')+'" onclick="markCollection(\''+c.ref+'\',\'dna\')">'+ic('x',13)+' Did not attend</button>';
      h+='</div>';
      h+='</div>';
    });
    h+='</div>';
  }

  /* Outstanding actions — full width, with sort + volunteer filter */
  var allActions=(DATA.actions||[]).filter(function(a){return a.status!=='done';});
  /* Volunteer filter */
  var volSet={};allActions.forEach(function(a){if(a.officer)volSet[a.officer]=true;});
  var volNames=['All'].concat(Object.keys(volSet).sort());
  var filteredActions=STATE.actionVolFilter==='All'?allActions:allActions.filter(function(a){return a.officer===STATE.actionVolFilter;});
  /* Sort */
  var aSortDir=STATE.actionSortDir==='desc'?-1:1;
  if(STATE.actionSort==='date'){filteredActions.sort(function(a,b){return((a.dueBy||'9').localeCompare(b.dueBy||'9'))*aSortDir;});}
  else if(STATE.actionSort==='name'){filteredActions.sort(function(a,b){return((a.name||'').localeCompare(b.name||''))*aSortDir;});}
  else if(STATE.actionSort==='officer'){filteredActions.sort(function(a,b){return((a.officer||'').localeCompare(b.officer||''))*aSortDir;});}

  h+='<div class="card" style="padding:0;overflow:hidden;margin-top:20px">';
  h+='<div style="padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
  h+='<h2 style="margin:0;display:flex;align-items:center;gap:8px;flex:1">'+ic('folder-open',16)+'Outstanding actions <span class="nav-badge">'+filteredActions.length+'</span></h2>';
  /* Volunteer filter */
  h+='<select class="filter-sel" onchange="STATE.actionVolFilter=this.value;render()">';
  volNames.forEach(function(v){h+='<option'+(STATE.actionVolFilter===v?' selected':'')+'>'+v+'</option>';});
  h+='</select>';
  h+='</div>';

  if(!filteredActions.length){
    h+='<div style="padding:24px;text-align:center;color:var(--muted);font-size:14px">No outstanding actions'+(STATE.actionVolFilter!=='All'?' for '+STATE.actionVolFilter:'')+'.</div>';
  } else {
    /* Table with sortable headers */
    function actSortHdr(col,label){
      var active=STATE.actionSort===col;
      var arrow=active?(STATE.actionSortDir==='asc'?ic('chevron-up',12):ic('chevron-down',12)):ic('chevrons-up-down',12);
      return '<th class="sortable'+(active?' sorted':'')+'" onclick="STATE.actionSort=\''+col+'\';STATE.actionSortDir=STATE.actionSort===\''+col+'\'&&STATE.actionSortDir===\'asc\'?\'desc\':\'asc\';render()">'+label+'<span class="sort-arrow">'+arrow+'</span></th>';
    }
    h+='<table class="rtable"><thead><tr>';
    h+='<th>Ref</th><th>Name</th><th>Action</th>';
    h+=actSortHdr('date','Due');
    h+=actSortHdr('officer','Officer');
    h+='<th></th></tr></thead><tbody>';
    filteredActions.forEach(function(a){
      var ov=a.dueBy&&a.dueBy<todayStr;
      h+='<tr onclick="go(\'detail\',\''+a.ref+'\')"'+(ov?' class="dna-table-row"':'')+'>';
      h+='<td class="r-ref" style="font-size:11px">'+esc(a.ref)+'</td>';
      h+='<td style="font-weight:500">'+esc(a.name)+(ov?' <span class="overdue-tag">Overdue</span>':'')+'</td>';
      h+='<td class="r-muted" style="font-size:13px">'+esc(a.action)+'</td>';
      h+='<td class="r-muted" style="white-space:nowrap">'+esc(a.dueBy||'—')+'</td>';
      h+='<td class="r-muted">'+esc(a.officer)+'</td>';
      h+='<td style="color:var(--faint)">'+ic('chevron-right',14)+'</td></tr>';
    });
    h+='</tbody></table>';
  }
  h+='</div>';
  return h;
}

/* ══════════════════════════════════════════════════════
   ALL REFERRALS  (search + filter)
══════════════════════════════════════════════════════ */
function toggleSort(col){
  if(STATE.allRefSort===col){STATE.allRefSortDir=STATE.allRefSortDir==='asc'?'desc':'asc';}
  else{STATE.allRefSort=col;STATE.allRefSortDir='asc';}
  render();
}
function sortHeader(col,label){
  var active=STATE.allRefSort===col;
  var arrow=active?(STATE.allRefSortDir==='asc'?ic('chevron-up',12):ic('chevron-down',12)):ic('chevrons-up-down',12);
  return '<th class="sortable'+(active?' sorted':'')+'" onclick="toggleSort(\''+col+'\')">'+label+'<span class="sort-arrow">'+arrow+'</span></th>';
}
function renderAllReferrals(){
  var refs=DATA.referrals||[];
  var q=(STATE.allRefSearch||'').toLowerCase();
  var f=STATE.allRefFilter||'all';
  var bor=STATE.allRefBorough||'all';

  /* Counts per filter */
  var allCount=refs.length;
  var triageCount=refs.filter(isNewRef).length;
  var inProgCount=refs.filter(isRegAppt).length;
  var waitCount=refs.filter(isWaitingList).length;
  var benCount=refs.filter(isBeneficiary).length;
  var closedCount=refs.filter(isClosed).length;

  /* Filter */
  var shown=refs.filter(function(r){
    if(q){var hay=(r.ref+' '+r.name+' '+r.phone+' '+r.email+' '+r.borough+' '+r.status).toLowerCase();if(hay.indexOf(q)<0)return false;}
    if(bor!=='all'&&r.borough!==bor)return false;
    if(f==='triage')return isNewRef(r);
    if(f==='inProgress')return isRegAppt(r);
    if(f==='waitingList')return isWaitingList(r);
    if(f==='beneficiary')return isBeneficiary(r);
    if(f==='closed')return isClosed(r);
    return true;
  });

  /* Sort */
  var sc=STATE.allRefSort||'name';
  var sd=STATE.allRefSortDir==='desc'?-1:1;
  shown.sort(function(a,b){
    var va,vb;
    if(sc==='ref'){va=a.ref;vb=b.ref;}
    else if(sc==='name'){va=(a.name||'').toLowerCase();vb=(b.name||'').toLowerCase();}
    else if(sc==='borough'){va=a.borough||'';vb=b.borough||'';}
    else if(sc==='type'){va=a.type||'';vb=b.type||'';}
    else if(sc==='date'){va=a.receivedDate||'';vb=b.receivedDate||'';}
    else if(sc==='status'){va=a.status||'';vb=b.status||'';}
    else{va='';vb='';}
    if(va<vb)return -1*sd;if(va>vb)return sd;return 0;
  });

  /* Header */
  var h='<div class="head-row"><div><h1>Referrals</h1><p style="color:var(--muted);margin-top:4px">'+shown.length+' of '+allCount+' referrals</p></div>';
  h+='<div class="searchbox">'+ic('search',15)+'<input placeholder="Search name, ref, phone, email, borough…" value="'+esc(STATE.allRefSearch||'')+'" oninput="STATE.allRefSearch=this.value;render()"></div></div>';

  /* ToggleGroup filter + borough select */
  h+='<div class="filter-bar">';
  h+='<div class="toggle-group">';
  var filters=[['all','All',allCount],['triage','New',triageCount],['inProgress','Reg. Appointments',inProgCount],['waitingList','Waiting List',waitCount],['beneficiary','Beneficiaries',benCount],['closed','Closed',closedCount]];
  filters.forEach(function(fi){
    h+='<button class="'+(f===fi[0]?'on':'')+'" onclick="STATE.allRefFilter=\''+fi[0]+'\';render()">'+fi[1]+' <span style="font-size:11px;opacity:.7">'+fi[2]+'</span></button>';
  });
  h+='</div>';
  h+='<select class="filter-sel" onchange="STATE.allRefBorough=this.value;render()"><option value="all">All boroughs</option>';
  ['Lambeth','Southwark','Wandsworth','Croydon'].forEach(function(b){h+='<option value="'+b+'"'+(bor===b?' selected':'')+'>'+b+'</option>';});
  h+='</select>';
  h+='</div>';

  if(!shown.length){h+='<div class="card placeholder">No referrals match your filters.</div>';return h;}

  /* Table with sortable headers */
  h+='<div class="card" style="overflow-x:auto"><table class="rtable"><thead><tr>';
  h+=sortHeader('ref','Ref');
  h+=sortHeader('name','Name');
  h+=sortHeader('borough','Borough');
  h+=sortHeader('type','Type');
  h+=sortHeader('date','Received');
  h+=sortHeader('status','Status');
  h+='</tr></thead><tbody>';
  shown.forEach(function(r){
    var flagged=r.flags&&(r.flags.indexOf('overdue')>=0||r.flags.indexOf('urgent')>=0);
    var isDna=r.status==='Did not attend (DNA) registration';
    var rowClass=(flagged?'flag-row':'')+(isDna?' dna-table-row':'');
    var refNum=r.ref.replace('REF-','');
    h+='<tr class="'+rowClass.trim()+'" onclick="go(\'detail\',\''+r.ref+'\')">';
    h+='<td class="r-ref">'+esc(refNum)+'</td>';
    h+='<td><span class="r-name">'+renderFlags(r,{showEmerg:true})+esc(r.name)+(flagged?' '+ic('warn',14):'')+'</span></td>';
    h+='<td class="r-muted">'+esc(r.borough)+'</td>';
    var typeCls=r.type==='EMERGENCY'?'type-emergency':'type-standard';
    h+='<td><span class="type-badge '+typeCls+'">'+esc(r.type==='EMERGENCY'?'Emergency':'Standard')+'</span></td>';
    h+='<td class="r-muted">'+fmtDate(r.receivedDate)+'</td>';
    h+='<td>'+statusPill(r)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

/* ══════════════════════════════════════════════════════
   REGISTRATIONS  (appointment-booked, sorted by time/day)
══════════════════════════════════════════════════════ */
function renderRegistrations(){
  var allRefs=DATA.referrals||[];
  var q=STATE.regSearch||'';
  // Booked appointments (have a date)
  var booked=allRefs.filter(function(r){return APPT_PENDING.indexOf(r.status)>=0&&r.apptDate;});
  if(q)booked=booked.filter(function(r){return(r.name+' '+r.ref).toLowerCase().indexOf(q.toLowerCase())>=0;});
  // DNA / need to rescheduled (no date, problematic status)
  var dnaStatuses=['Did not attend (DNA) registration','2nd contact attempt - waiting response','1st contact attempt - waiting response','Appointment Rescheduled'];
  var dna=allRefs.filter(function(r){return dnaStatuses.indexOf(r.status)>=0&&!r.apptDate;});
  if(q)dna=dna.filter(function(r){return(r.name+' '+r.ref).toLowerCase().indexOf(q.toLowerCase())>=0;});
  var groups={};booked.forEach(function(r){(groups[r.apptDate]=groups[r.apptDate]||[]).push(r);});
  var days=Object.keys(groups).sort();
  var h='<div class="head-row"><div><h1>Registrations</h1><p style="color:var(--muted);margin-top:4px">Appointments booked by day, plus cases that need re-booking.</p></div>';
  h+='<div class="searchbox">'+ic('search',15)+'<input placeholder="Search name, ref, phone, email, borough…" value="'+esc(q)+'" oninput="STATE.regSearch=this.value;render()"></div></div>';
  // ── Booked appointments ──
  if(!days.length){
    h+='<div class="card placeholder" style="margin-bottom:20px"><div class="pic">'+ic('cal',32)+'</div><b>No registration appointments booked</b><p style="margin-top:8px">Applicants who have been sent a booking invite will appear here.</p></div>';
  } else {
    days.forEach(function(day){
      var list=groups[day].sort(function(a,b){return(a.apptTime||'').localeCompare(b.apptTime||'');});
      var d2=new Date(day+'T00:00:00');var label=isNaN(d2)?day:d2.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
      h+='<div class="day-group"><div class="day-head">'+ic('cal',16)+label+'<span class="day-cnt">'+list.length+' booked</span></div>';
      h+='<div class="card">';
      list.forEach(function(r){
        h+='<div class="appt-row" onclick="openReg(\''+r.ref+'\')"><div class="appt-time">'+esc(r.apptTime||'—')+'</div><div class="appt-info"><div class="appt-name">'+renderFlags(r,{showEmerg:false})+esc(r.name)+'</div><div class="appt-meta">'+esc(r.ref)+' · '+esc(r.borough)+' · '+hh(r)+(r.apptType==='online'?' · Online':' · In-person')+'</div></div>'+
          '<div style="font-size:12.5px;color:var(--muted);white-space:nowrap;margin-right:8px">'+(r.apptSlot&&r.apptSlot!=='Anyone'?'<span style="color:var(--plum);font-weight:500">'+esc(r.apptSlot)+'</span>':'Anyone')+'</div>'+
          statusPill(r)+'<span style="color:var(--faint);margin-left:8px">'+ic('arrow')+'</span></div>';
      });
      h+='</div></div>';
    });
  }
  // ── DNA / need to reschedule ──
  h+='<h2 style="margin:6px 0 10px;display:flex;align-items:center;gap:10px">'+ic('warn',18)+' Did not attend / need to reschedule';
  if(dna.length)h+='<span style="font-family:\'IBM Plex Mono\';font-size:11px;background:var(--red-bg);color:var(--red);padding:3px 9px;border-radius:6px">'+dna.length+' flagged</span>';
  h+='</h2>';
  if(!dna.length){
    h+='<div class="card placeholder" style="padding:18px">No cases currently flagged as DNA or needing reschedule.</div>';
  } else {
    h+='<div class="dna-card">';
    dna.forEach(function(r){
      h+='<div class="dna-row"><div class="bene-avatar" style="width:36px;height:36px;font-size:13px;background:var(--red-bg);color:var(--red)">'+esc(r.name.charAt(0))+'</div>';
      h+='<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14.5px">'+esc(r.name)+'</div>';
      h+='<div style="font-size:12.5px;color:var(--muted)">'+esc(r.ref)+' · '+esc(r.borough)+' · Received '+fmtDate(r.receivedDate)+'</div></div>';
      h+=statusPill(r);
      h+='<button class="btn btn-ghost" style="font-size:13px;padding:8px 14px" onclick="go(\'detail\',\''+r.ref+'\')">';
      h+=ic('cal',14)+'Rebook</button></div>';
    });
    h+='</div>';
  }
  return h;
}
function openReg(ref){STATE.view='detail';STATE.ref=ref;STATE.step=2;STATE.wtab=1;render();window.scrollTo(0,0);}

/* ══════════════════════════════════════════════════════
   BENEFICIARIES
══════════════════════════════════════════════════════ */
function renderBen(){
  var refs=(DATA.referrals||[]).slice();
  var q=(STATE.benSearch||'').toLowerCase();
  refs=refs.filter(function(r){
    if(q&&(r.name+' '+r.ref).toLowerCase().indexOf(q)<0)return false;
    if(STATE.benFilter==='open')return ACTIVE_STATUSES.indexOf(r.status)>=0;
    if(STATE.benFilter==='delivery')return DELIVERY_WAIT_STATUSES.indexOf(r.status)>=0;
    if(STATE.benFilter==='closed')return isClosed(r);
    if(STATE.benFilter!=='all')return false;
    if(STATE.benBorough!=='all'&&r.borough!==STATE.benBorough)return false;
    return true;
  });
  var catRank={open:0,awaiting:1,closed:2};
  refs.sort(function(a,b){var ca=catRank[benCat(a)],cb=catRank[benCat(b)];if(ca!==cb)return ca-cb;var xa=isComplex(a)?0:1,xb=isComplex(b)?0:1;if(xa!==xb)return xa-xb;var fa=isFinalMonth(a)?0:1,fb=isFinalMonth(b)?0:1;return fa-fb;});
  var h='<div class="head-row"><div><h1>Beneficiaries</h1><p style="color:var(--muted);margin-top:4px">Active beneficiaries, prioritised: open → complex → final month.</p></div>';
  h+='<div class="searchbox">'+ic('search',15)+'<input placeholder="Search name, ref, phone, email, borough…" value="'+esc(STATE.benSearch||'')+'" oninput="STATE.benSearch=this.value;render()"></div></div>';
  h+='<div style="margin-bottom:16px">'+boroughBreakdown()+'</div>';
  h+='<div class="filter-strip">';
  ['all|All','open|Active','delivery|Waiting for Delivery','closed|Closed'].forEach(function(o){var p=o.split('|');h+='<button class="fchip'+(STATE.benFilter===p[0]?' on':'')+'" onclick="STATE.benFilter=\''+p[0]+'\';render()">'+p[1]+'</button>';});
  h+='<select class="filter-sel" onchange="STATE.benBorough=this.value;render()"><option value="all">All boroughs</option>';
  ['Lambeth','Southwark','Wandsworth','Croydon'].forEach(function(b){h+='<option value="'+b+'" '+(STATE.benBorough===b?'selected':'')+'>'+b+'</option>';});
  h+='</select><span style="color:var(--muted);font-size:13px;margin-left:auto">'+refs.length+' shown</span></div>';
  if(!refs.length){h+='<div class="card placeholder">No beneficiaries match your filters.</div>';return h;}
  h+='<div class="card" style="overflow-x:auto"><table class="rtable"><thead><tr><th>Ref</th><th>Name</th><th>Borough</th><th>Status</th><th>Support Period</th><th>Distribution</th></tr></thead><tbody>';
  refs.forEach(function(r){
    var tags=renderFlags(r,{showEmerg:true,showFinal:true});
    var dist=(r.distributionGroup||'')+(r.distributionType?' · '+r.distributionType:'');
    h+='<tr onclick="openBeneFile(\''+r.ref+'\')">';
    h+='<td class="r-ref">'+esc(r.ref.replace('REF-',''))+'</td>';
    h+='<td><span class="r-name">'+tags+esc(r.name)+'</span></td>';
    h+='<td class="r-muted">'+esc(r.borough)+'</td>';
    h+='<td>'+statusPill(r)+'</td>';
    h+='<td class="r-muted">'+esc(monthsOpen(r))+'</td>';
    h+='<td class="r-muted">'+esc(dist||'—')+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}
