  // ── Borough boxes ──
  var h='<div>';
  h+='<div class="bor-row">';
  CATCHMENT.forEach(function(b){
    var n=counts[b]||0;
    var pct=total?Math.round(n/total*100):0;
    var isLambeth=(b==='Lambeth');
    var pctColor=isLambeth?(lambethOk?'var(--green)':'var(--red)'):COLORS[b];
    h+='<div class="bor-box '+CLASSES[b]+'">';
    h+='<div class="bor-label">'+b+'</div>';
    h+='<div class="bor-count">'+n+' <span style="font-size:14px;font-weight:500;color:var(--muted)">referrals</span></div>';
    h+='<div class="bor-pct" style="color:'+pctColor+'">'+pct+'%</div>';
    if(isLambeth)h+='<div class="bor-sub '+(lambethOk?'bor-ok':'bor-warn')+'">'+(lambethOk?'✓ Above 76% threshold':'⚠ Below 76% threshold')+'</div>';
    else h+='<div class="bor-sub">of all referrals</div>';
    if(showProvisional&&(prov[b]||0)>0)h+='<div class="bor-sub" style="color:var(--green)">+'+prov[b]+' pending</div>';
    h+='</div>';
  });
  h+='<div class="bor-box" style="border-color:var(--line-soft);background:var(--cream)">';
  h+='<div class="bor-label">Total</div>';
  h+='<div class="bor-count">'+total+'</div>';
  h+='<div class="bor-pct" style="color:var(--muted);font-size:18px">referrals</div>';
  if(showProvisional)h+='<div class="bor-sub" style="color:var(--green)">+'+provTotal+' pending</div>';
  h+='</div>';
  h+='</div>';

  // ── Capacity box ──
  h+='<div class="cap-box">';
  h+='<div class="cap-title">Lambeth capacity rule — max '+LAMBETH_MIN+'% non-Lambeth</div>';
  h+='<div class="cap-result '+(lambethOk?'ok':'warn')+'">';
  if(lambethOk){
    h+=ic('check',15)+' Lambeth is at '+lambethPct+'% — within threshold. ';
    h+=maxNonLambeth===0?'Adding any non-Lambeth referral will breach 76%.':'You can accept up to <b>'+maxNonLambeth+' more non-Lambeth</b> referral'+(maxNonLambeth>1?'s':'')+" before Lambeth drops below 76%.";
  }else{
    h+=ic('warn',15)+' Lambeth is at '+lambethPct+'% — <b>below the 76% threshold</b>. Prioritise Lambeth referrals to restore balance.';
  }
  h+='</div>';

  // ── Provisional calculator ──
  h+='<details style="cursor:pointer"><summary style="font-size:13.5px;color:var(--green-deep);font-weight:500;user-select:none;padding:2px 0">'+ic('cal',14)+' Provisional: add pending registrations to see projected %</summary>';
  h+='<p style="font-size:12.5px;color:var(--muted);margin:8px 0 6px">Enter how many people from each borough are completing registration this session:</p>';
  h+='<div class="prov-grid">';
  CATCHMENT.forEach(function(b){
    h+='<div class="prov-inp"><label>'+b+'</label>';
    h+='<input type="number" min="0" value="'+(prov[b]||0)+'" onchange="DATA.provCounts=DATA.provCounts||{};DATA.provCounts.'+b+'=parseInt(this.value)||0;render()">';
    h+='</div>';
  });
  h+='</div>';
  if(showProvisional){
    var newMaxNL=Math.max(0,Math.floor(provLambeth/(LAMBETH_MIN/100))-provTotalAll);
    h+='<div class="prov-result">';
    h+='If all '+provTotal+' pending registrations complete: ';
    h+='Lambeth would be <b style="color:'+(provOk?'var(--green)':'var(--red)')+'">'+provPct+'%</b> of '+provTotalAll+' total. ';
    if(provOk){h+='<span style="color:var(--green)">✓ Still above threshold.</span> Could take up to '+newMaxNL+' more non-Lambeth.';}
    else{h+='<span style="color:var(--red)">⚠ Would fall below 76%. Consider adding more Lambeth referrals.</span>';}
    h+='</div>';
  }
  h+='</details>';
  h+='</div>';
  h+='</div>';
  return h;
}
function flagList(r){return(r.flags||'').split(',').map(function(s){return s.trim();}).filter(Boolean);}
function isComplex(r){return flagList(r).indexOf('complex')>=0;}
/* Central flag renderer — call with (r, opts)
   opts.showEmerg = true to include Emergency tag
   opts.showFinal = true to include Final month tag
   Returns HTML string of all applicable tags and dots */
function renderFlags(r,opts){
  opts=opts||{};
  var flags=flagList(r);
  var h='';
  // Sensitive dot flags first (no readable label, tooltip only)
  if(flags.indexOf('dv')>=0)  h+='<span class="flag-dot flag-dot-dv" data-tip="DV / DA — domestic violence" title="DV / DA — domestic violence"></span>';
  if(flags.indexOf('da')>=0)  h+='<span class="flag-dot flag-dot-da" data-tip="D&A — drug & alcohol use" title="D&A — drug & alcohol use"></span>';
  // Text tags
  if(flags.indexOf('complex')>=0)    h+='<span class="flag-tag flag-complex">Complex</span>';
  if(flags.indexOf('disability')>=0) h+='<span class="flag-tag flag-dis">DIS</span>';
  if(flags.indexOf('interpreter')>=0)h+='<span class="flag-tag flag-int">INT</span>';
  if(opts.showEmerg&&r.type==='EMERGENCY') h+='<span class="flag-tag flag-emerg">Emergency</span>';
  if(opts.showFinal&&isFinalMonth(r)) h+='<span class="flag-tag flag-final">Final month</span>';
  return h;
}
function getWelfare(r){if(!r._wf){try{r._wf=JSON.parse(r.welfareJson||'{}')||{};}catch(e){r._wf={};}if(!r._wf.tasks)r._wf.tasks={};}return r._wf;}
function surnameFirst(r){return(r.name||'').toUpperCase();}
function monthsOpen(r){if(r.openFrom&&r.openTo)return r.openFrom+'–'+r.openTo;return '—';}
function fmtDate(s){
  /* Convert stored date strings (e.g. "06 Jan", "06 Jan 2026") to dd/mm/yyyy */
  if(!s)return '—';
  var months={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  var m=s.match(/^(\d{1,2})\s+([A-Za-z]{3})(?:\s+(\d{4}))?$/);
  if(!m)return s;
  var day=m[1].padStart(2,'0');
  var mon=months[m[2]]||'??';
  var yr=m[3]||new Date().getFullYear();
  return day+'/'+mon+'/'+yr;
}
function isFinalMonth(r){return r.openTo&&r.openTo===MONTHS[new Date().getMonth()]&&BENEFICIARY_STATUSES.indexOf(r.status)>=0;}
function statusPill(r){var m=statusMeta(r.status);return '<span class="status-pill '+m.tone+'"><span class="dot"></span>'+esc(r.status)+'</span>';}
function benCat(r){if(CLOSED_STATUSES.indexOf(r.status)>=0)return 'closed';if(BENEFICIARY_STATUSES.indexOf(r.status)>=0)return 'open';return 'awaiting';}
/* Status check helpers */
function isNewRef(r){return NEW_STATUSES.indexOf(r.status)>=0;}
function isReferral(r){return REFERRAL_STATUSES.indexOf(r.status)>=0;}
function isRegAppt(r){return REG_APPOINTMENT_STATUSES.indexOf(r.status)>=0;}
function isWaitingList(r){return WAITING_LIST_STATUSES.indexOf(r.status)>=0;}
function isBeneficiary(r){return BENEFICIARY_STATUSES.indexOf(r.status)>=0;}
function isClosed(r){return CLOSED_STATUSES.indexOf(r.status)>=0;}
/* Tagline for detail page header */
function detailTagline(r){
  var parts=[esc(r.borough),hhWords(r)];
  if(r.openFrom&&r.openTo){
    parts.push('supporting '+esc(r.openFrom)+' – '+esc(r.openTo));
    /* calc months remaining */
    var now=new Date();
    var monthMap={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    var m=r.openTo.match(/^([A-Za-z]{3})\s+(\d{4})$/);
    if(m){
      var endMonth=monthMap[m[1]],endYear=+m[2];
      var diff=(endYear-now.getFullYear())*12+(endMonth-now.getMonth());
      if(diff>0)parts.push(diff+' month'+(diff>1?'s':'')+' remaining');
      else if(diff===0)parts.push('final month');
    }
  }
  return parts.join(' · ');
}
/* Breadcrumb: renderBreadcrumb([['Label','view'],['Label','view'],...], 'Current Page') */
function renderBreadcrumb(links,current){
  var h='<nav class="breadcrumb">';
  links.forEach(function(l){
    h+='<button onclick="go(\''+l[1]+'\')">'+esc(l[0])+'</button><span class="sep">›</span>';
  });
  h+='<span class="current">'+esc(current)+'</span></nav>';
  return h;
}
function deepSet(o,path,v){var p=path.split('.'),c=o;for(var i=0;i<p.length-1;i++){if(!c[p[i]])c[p[i]]={};c=c[p[i]];}c[p[p.length-1]]=v;}
function parseChildAges(agesStr){
  if(!agesStr)return[];
  return String(agesStr).split(',').map(function(s){s=s.trim();var m=s.match(/^(\d+)([MFmf]?)$/);return m?{age:m[1],gender:m[2].toUpperCase()||''}:{age:s,gender:''};});
}
