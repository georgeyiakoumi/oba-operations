function boroughBreakdown(){
  var refs=DATA.referrals||[];
  var CATCHMENT=['Lambeth','Southwark','Wandsworth','Croydon'];
  var COLORS={Lambeth:'#557a16',Southwark:'#8d2b5f',Wandsworth:'#c06e14',Croydon:'#2a6a9a'};

  var counts={};CATCHMENT.forEach(function(b){counts[b]=0;});
  refs.forEach(function(r){if(counts[r.borough]!==undefined)counts[r.borough]++;});
  var total=CATCHMENT.reduce(function(s,b){return s+(counts[b]||0);},0);
  if(total===0)return'';

  /* Beneficiary stats */
  var activeBens=refs.filter(isBeneficiary);
  var collections=activeBens.filter(function(r){return r.distributionType==='Collection';}).length;
  var deliveries=activeBens.filter(function(r){return r.distributionType==='Delivery';}).length;
  var finalMonth=activeBens.filter(function(r){return isFinalMonth(r);}).length;
  var complexCount=activeBens.filter(function(r){return isComplex(r);}).length;

  var h='<div class="overview-stats">';

  /* ── Donut chart card ── */
  h+='<div class="card donut-card">';
  h+='<div style="font-weight:600;font-size:15px;margin-bottom:16px;align-self:flex-start">Borough Breakdown</div>';
  var R=70,CX=90,CY=90,CIRC=2*Math.PI*R;
  h+='<div class="donut-wrap"><svg viewBox="0 0 180 180">';
  var offset=0;
  CATCHMENT.forEach(function(b){
    var n=counts[b]||0;if(n===0)return;
    var seg=n/total*CIRC;
    h+='<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="'+COLORS[b]+'" stroke-width="24" stroke-dasharray="'+seg+' '+(CIRC-seg)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+CX+' '+CY+')" />';
    offset+=seg;
  });
  h+='</svg>';
  h+='<div class="donut-center"><span class="dc-num">'+total+'</span><span class="dc-label">referrals</span></div>';
  h+='</div>';
  h+='<div class="donut-legend">';
  CATCHMENT.forEach(function(b){h+='<div class="dl-item"><span class="dl-dot" style="background:'+COLORS[b]+'"></span>'+b+' <span class="dl-count">'+counts[b]+'</span></div>';});
  h+='</div></div>';

  /* ── Beneficiary summary card (replaces Lambeth threshold) ── */
  h+='<div class="card" style="padding:24px 20px">';
  h+='<div style="font-weight:600;font-size:15px;margin-bottom:16px">Open Beneficiaries</div>';
  var sumRows=[
    ['Total active',activeBens.length,'var(--green)'],
    ['Collections',collections,'var(--ink)'],
    ['Deliveries',deliveries,'var(--orange)'],
    ['Final month',finalMonth,'var(--red)'],
    ['Complex',complexCount,'var(--plum)']
  ];

    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line-soft);font-size:14px">';
    h+='<span style="color:var(--muted)">'+row[0]+'</span>';
    h+='<span style="font-family:var(--font-heading);font-weight:700;font-size:20px;color:'+row[2]+'">'+row[1]+'</span>';
    h+='</div>';
  });
  h+='</div>';

  h+='</div>';
  return h;
}

/* Lambeth threshold bar — rendered on New Referrals page */
function renderLambethBar(){
  var refs=DATA.referrals||[];
  var CATCHMENT=['Lambeth','Southwark','Wandsworth','Croydon'];
  var LAMBETH_MIN=76;
  var counts={};CATCHMENT.forEach(function(b){counts[b]=0;});
  refs.forEach(function(r){if(counts[r.borough]!==undefined)counts[r.borough]++;});
  var total=CATCHMENT.reduce(function(s,b){return s+(counts[b]||0);},0);
  if(total===0)return'';
  var lambethN=counts['Lambeth']||0;
  var lambethPct=total?Math.round(lambethN/total*100):0;
  var lambethOk=lambethPct>=LAMBETH_MIN;
  var lambethClose=lambethPct>=LAMBETH_MIN-10&&!lambethOk;
  var maxNonLambeth=Math.max(0,Math.floor(lambethN/(LAMBETH_MIN/100))-total);
  var barColor=lambethOk?'var(--green)':lambethClose?'var(--orange)':'var(--red)';
  var statusLabel=lambethOk?'Met':lambethClose?'Close':'Below';
  var statusCls=lambethOk?'th-badge-met':lambethClose?'th-badge-close':'th-badge-below';

  var h='<div class="card" style="padding:12px 20px;margin-bottom:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">';
  h+='<span style="font-weight:600;font-size:14px;white-space:nowrap">Lambeth Target</span>';
  h+='<span class="th-badge '+statusCls+'" style="font-size:10px">'+statusLabel+'</span>';
  h+='<span style="font-family:var(--font-heading);font-weight:700;font-size:20px;color:'+barColor+'">'+lambethPct+'%</span>';
  h+='<div style="flex:1;min-width:120px"><div class="th-bar-wrap" style="margin-bottom:0"><div class="th-bar-fill" style="width:'+Math.min(lambethPct,100)+'%;background:'+barColor+'"></div><div class="th-bar-marker" style="left:'+LAMBETH_MIN+'%"></div></div></div>';
  h+='<span style="font-size:12px;color:var(--muted);white-space:nowrap">';
  if(lambethOk)h+='Headroom: '+maxNonLambeth+' non-Lambeth';
  else{var needed=Math.ceil((LAMBETH_MIN/100*total-lambethN)/(1-LAMBETH_MIN/100));h+='Need '+Math.max(needed,1)+' more Lambeth';}
  h+='</span></div>';
  return h;
}
function flagList(r){return(r.flags||'').split(',').map(function(s){return s.trim();}).filter(Boolean);}
function isComplex(r){return flagList(r).indexOf('complex')>=0;}
/* Central flag renderer — call with (r, opts)
   opts.showEmerg = true to include Emergency tag
   opts.showFinal = true to include Final month tag
   Returns HTML string of all applicable tags and dots */
function renderFlags(r,opts){
  opts=opts||{};
  var flags=flagList(r);
  var h='';
  // Sensitive dot flags first (no readable label, tooltip only)
  if(flags.indexOf('dv')>=0)  h+='<span class="flag-dot flag-dot-dv" data-tip="DV / DA — domestic violence" title="DV / DA — domestic violence"></span>';
  if(flags.indexOf('da')>=0)  h+='<span class="flag-dot flag-dot-da" data-tip="D&A — drug & alcohol use" title="D&A — drug & alcohol use"></span>';
  // Text tags
  if(flags.indexOf('complex')>=0)    h+='<span class="flag-tag flag-complex">Complex</span>';
  if(flags.indexOf('disability')>=0) h+='<span class="flag-tag flag-dis">DIS</span>';
  if(flags.indexOf('interpreter')>=0)h+='<span class="flag-tag flag-int">INT</span>';
  if(opts.showEmerg&&r.type==='EMERGENCY') h+='<span class="flag-tag flag-emerg">Emergency</span>';
  if(opts.showFinal&&isFinalMonth(r)) h+='<span class="flag-tag flag-final">Final month</span>';
  return h;
}

function monthsOpen(r){if(r.openFrom&&r.openTo)return r.openFrom+'–'+r.openTo;return '—';}
function fmtDate(s){
  /* Convert any date string to "1 Jul 2026" format */
  if(!s)return '—';
  var MNAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  /* ISO format: 2026-08-04 */
  var iso=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(iso){return parseInt(iso[3])+' '+MNAMES[parseInt(iso[2])-1]+' '+iso[1];}
  /* "06 Jan" or "06 Jan 2026" */
  var m=s.match(/^(\d{1,2})\s+([A-Za-z]{3})(?:\s+(\d{4}))?$/);
  if(m){return parseInt(m[1])+' '+m[2]+' '+(m[3]||new Date().getFullYear());}
  /* "dd Mon" from relDate — e.g. "03 Aug" */
  var rd=s.match(/^(\d{2})\s+([A-Za-z]{3})$/);
  if(rd){return parseInt(rd[1])+' '+rd[2]+' '+new Date().getFullYear();}
  return s;
}
function isFinalMonth(r){return r.openTo&&r.openTo===MONTHS[new Date().getMonth()]&&BENEFICIARY_STATUSES.indexOf(r.status)>=0;}
function statusPill(r){var m=statusMeta(r.status);return '<span class="status-pill '+m.tone+'"><span class="dot"></span>'+esc(r.status)+'</span>';}
function benCat(r){if(CLOSED_STATUSES.indexOf(r.status)>=0)return 'closed';if(BENEFICIARY_STATUSES.indexOf(r.status)>=0)return 'open';return 'awaiting';}
/* Status check helpers */
function isNewRef(r){return NEW_STATUSES.indexOf(r.status)>=0;}
function isReferral(r){return REFERRAL_STATUSES.indexOf(r.status)>=0;}
function isRegAppt(r){return REG_APPOINTMENT_STATUSES.indexOf(r.status)>=0;}
function isWaitingList(r){return WAITING_LIST_STATUSES.indexOf(r.status)>=0;}
function isBeneficiary(r){return BENEFICIARY_STATUSES.indexOf(r.status)>=0;}
function isClosed(r){return CLOSED_STATUSES.indexOf(r.status)>=0;}
/* Tagline for detail page header */
function detailTagline(r){
  var parts=[esc(r.borough),hhWords(r)];
  if(r.openFrom&&r.openTo){
    parts.push('supporting '+esc(r.openFrom)+' – '+esc(r.openTo));
    /* calc months remaining */
    var now=new Date();
    var monthMap={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    var m=r.openTo.match(/^([A-Za-z]{3})\s+(\d{4})$/);
    if(m){
      var endMonth=monthMap[m[1]],endYear=+m[2];
      var diff=(endYear-now.getFullYear())*12+(endMonth-now.getMonth());
      if(diff>0)parts.push(diff+' month'+(diff>1?'s':'')+' remaining');
      else if(diff===0)parts.push('final month');
    }
  }
  return parts.join(' · ');
}
/* Breadcrumb: renderBreadcrumb([['Label','view'],['Label','view'],...], 'Current Page') */
function renderBreadcrumb(links,current){
  var h='<nav class="breadcrumb">';
  links.forEach(function(l){
    h+='<button onclick="go(\''+l[1]+'\')">'+esc(l[0])+'</button><span class="sep">›</span>';
  });
  h+='<span class="current">'+esc(current)+'</span></nav>';
  return h;
}
/* ── Household helpers ── */
var HH_ADMIN_PW='OBAadmin2026';
function getHousehold(id){return(DATA.households||[]).find(function(h){return h.id===id;});}
function getHouseholdForRef(ref){return(DATA.households||[]).find(function(h){return h.linkedRefs&&h.linkedRefs.indexOf(ref)>=0;});}
function searchHouseholds(query){
  if(!query||query.length<2)return[];
  var q=query.toLowerCase();
  var results=[];
  /* Search households */
  (DATA.households||[]).forEach(function(hh){
    var hay=(hh.name+' '+hh.primaryName+' '+hh.phone+' '+hh.email+' '+(hh.postcode||'')+' '+hh.linkedRefs.join(' ')).toLowerCase();
    if(hay.indexOf(q)>=0)results.push({type:'household',data:hh});
  });
  /* Search historical referrals not yet in a household */
  (DATA.historicalReferrals||[]).forEach(function(hr){
    var hay=(hr.ref+' '+(hr.householdId||'')+' '+hr.email+' '+hr.phone).toLowerCase();
    if(hay.indexOf(q)>=0&&!results.find(function(r){return r.type==='household'&&r.data.id===hr.householdId;})){
      var hh=getHousehold(hr.householdId);
      if(hh&&!results.find(function(r){return r.data.id===hh.id;}))results.push({type:'household',data:hh});
    }
  });
  return results;
}
function createHousehold(ref){
  var r=getRef(ref);if(!r)return;
  DATA.households=DATA.households||[];
  var id='HH-'+String(DATA.households.length+1).padStart(3,'0');
  var surname=(r.name||'').split(' ').pop();
  DATA.households.push({id:id,name:surname,primaryName:r.name,phone:r.phone,email:r.email,postcode:'',borough:r.borough,adults:r.adults,children:r.children,ages:r.ages,linkedRefs:[ref],created:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})});
  r.householdId=id;
  toast('Household '+id+' created for '+r.name);render();
}
function linkToHousehold(ref,hhId){
  var r=getRef(ref);if(!r)return;
  var hh=getHousehold(hhId);if(!hh)return;
  if(hh.linkedRefs.indexOf(ref)<0)hh.linkedRefs.push(ref);
  r.householdId=hhId;
  toast('Linked '+ref+' to household '+hh.primaryName);render();
}
function separateFromHousehold(ref,pw){
  if(pw!==HH_ADMIN_PW){toast('Incorrect password');return;}
  var r=getRef(ref);if(!r||!r.householdId)return;
  var hh=getHousehold(r.householdId);
  if(hh){hh.linkedRefs=hh.linkedRefs.filter(function(x){return x!==ref;});}
  createHousehold(ref);
  toast('Separated '+ref+' into new household');
}
function mergeHouseholds(fromId,toId,pw){
  if(pw!==HH_ADMIN_PW){toast('Incorrect password');return;}
  var from=getHousehold(fromId),to=getHousehold(toId);
  if(!from||!to)return;
  from.linkedRefs.forEach(function(ref){
    if(to.linkedRefs.indexOf(ref)<0)to.linkedRefs.push(ref);
    var r=getRef(ref);if(r)r.householdId=to.id;
  });
  DATA.households=DATA.households.filter(function(h){return h.id!==fromId;});
  toast('Merged '+from.primaryName+' into '+to.primaryName);render();
}
/* ── Unified tasks: collect all open wf.tasks across all referrals ── */
function getAllTasks(){
  var all=[];
  (DATA.referrals||[]).forEach(function(r){
    if(!isComplex(r)&&!isBeneficiary(r))return;
    var wf=getWelfare(r);
    Object.keys(wf.tasks||{}).forEach(function(area){
      (wf.tasks[area]||[]).forEach(function(tk,idx){
        if(tk.status==='Completed')return;
        all.push({ref:r.ref,name:r.name,borough:r.borough,area:area,task:tk,idx:idx});
      });
    });
  });
  return all;
}

function markCollection(ref,status){
  var cols=DATA.collections||[];
  for(var i=0;i<cols.length;i++){if(cols[i].ref===ref){cols[i].status=status;break;}}
  toast(status==='collected'?'Marked as collected':'Marked as did not attend');
  render();
}
function deepSet(o,path,v){var p=path.split('.'),c=o;for(var i=0;i<p.length-1;i++){if(!c[p[i]])c[p[i]]={};c=c[p[i]];}c[p[p.length-1]]=v;}
function parseChildAges(agesStr){
  if(!agesStr)return[];
  return String(agesStr).split(',').map(function(s){s=s.trim();var m=s.match(/^(\d+)([MFmf]?)$/);return m?{age:m[1],gender:m[2].toUpperCase()||''}:{age:s,gender:''};});
}
function formatChildren(children,agesStr){
  var count=parseInt(children)||0;
  if(count===0)return 'None';
  var parsed=parseChildAges(agesStr);
  if(!parsed.length)return count+'';
  return parsed.map(function(c){
    var label=c.gender==='M'?'Boy':c.gender==='F'?'Girl':'Child';
    return label+' ('+c.age+')';
  }).join(', ');
}
function calcDistGroup(regDate){
  if(!regDate)return '—';
  var d=parseInt(regDate)||0;
  return d>=1&&d<=14?'Group 1':'Group 2';
}
