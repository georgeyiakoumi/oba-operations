function boroughBreakdown(){
  var refs=DATA.referrals||[];
  var CATCHMENT=['Lambeth','Southwark','Wandsworth','Croydon'];
  var COLORS={Lambeth:'#557a16',Southwark:'#8d2b5f',Wandsworth:'#c06e14',Croydon:'#2a6a9a'};
  var LAMBETH_MIN=76;

  var counts={};CATCHMENT.forEach(function(b){counts[b]=0;});
  refs.forEach(function(r){if(counts[r.borough]!==undefined)counts[r.borough]++;});
  var total=CATCHMENT.reduce(function(s,b){return s+(counts[b]||0);},0);
  if(total===0)return'';

  var lambethN=counts['Lambeth']||0;
  var lambethPct=total?Math.round(lambethN/total*100):0;
  var lambethOk=lambethPct>=LAMBETH_MIN;
  var lambethClose=lambethPct>=LAMBETH_MIN-10&&!lambethOk;
  var maxNonLambeth=Math.max(0,Math.floor(lambethN/(LAMBETH_MIN/100))-total);

  /* Provisional state */
  var prov=DATA.provCounts||{Lambeth:0,Southwark:0,Wandsworth:0,Croydon:0};
  var provLambethExtra=prov.Lambeth||0;
  var provOtherExtra=(prov.Southwark||0)+(prov.Wandsworth||0)+(prov.Croydon||0);
  var provLambeth=lambethN+provLambethExtra;
  var provTotalAll=total+provLambethExtra+provOtherExtra;
  var provPct=provTotalAll?Math.round(provLambeth/provTotalAll*100):lambethPct;
  var showProvisional=provLambethExtra>0||provOtherExtra>0;

  var h='<div class="overview-stats">';

  /* ── Donut chart card ── */
  h+='<div class="card donut-card">';
  h+='<div style="font-weight:600;font-size:15px;margin-bottom:16px;align-self:flex-start">Borough Breakdown</div>';
  /* SVG donut */
  var R=70,CX=90,CY=90,CIRC=2*Math.PI*R;
  h+='<div class="donut-wrap"><svg viewBox="0 0 180 180">';
  var offset=0;
  CATCHMENT.forEach(function(b){
    var n=counts[b]||0;
    if(n===0)return;
    var seg=n/total*CIRC;
    h+='<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="'+COLORS[b]+'" stroke-width="24" stroke-dasharray="'+seg+' '+(CIRC-seg)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+CX+' '+CY+')" />';
    offset+=seg;
  });
  h+='</svg>';
  h+='<div class="donut-center"><span class="dc-num">'+total+'</span><span class="dc-label">referrals</span></div>';
  h+='</div>';
  /* Legend */
  h+='<div class="donut-legend">';
  CATCHMENT.forEach(function(b){
    h+='<div class="dl-item"><span class="dl-dot" style="background:'+COLORS[b]+'"></span>'+b+' <span class="dl-count">'+counts[b]+'</span></div>';
  });
  h+='</div>';
  h+='</div>';

  /* ── Lambeth threshold card ── */
  var statusLabel=lambethOk?'Met':lambethClose?'Close':'Below';
  var statusCls=lambethOk?'th-badge-met':lambethClose?'th-badge-close':'th-badge-below';
  var barColor=lambethOk?'var(--green)':lambethClose?'var(--orange)':'var(--red)';

  h+='<div class="card threshold-card">';
  h+='<div class="th-header"><span class="th-title">Lambeth Target</span><span class="th-badge '+statusCls+'">'+statusLabel+'</span></div>';
  h+='<div class="th-pct" style="color:'+barColor+'">'+lambethPct+'%</div>';
  h+='<div class="th-sub">of '+LAMBETH_MIN+'% target</div>';

  /* Progress bar */
  h+='<div class="th-bar-wrap">';
  h+='<div class="th-bar-fill" style="width:'+Math.min(lambethPct,100)+'%;background:'+barColor+'"></div>';
  if(showProvisional)h+='<div class="th-bar-proj" style="width:'+Math.min(provPct,100)+'%;background:'+barColor+'"></div>';
  h+='<div class="th-bar-marker" style="left:'+LAMBETH_MIN+'%"></div>';
  h+='</div>';
  h+='<div class="th-bar-label" style="margin-left:'+LAMBETH_MIN+'%;transform:translateX(-50%)">'+LAMBETH_MIN+'%</div>';

  /* Provisional inputs */
  h+='<div class="th-inputs">';
  h+='<div><label>+ Lambeth</label><input type="number" min="0" value="'+provLambethExtra+'" onchange="DATA.provCounts=DATA.provCounts||{Lambeth:0,Southwark:0,Wandsworth:0,Croydon:0};DATA.provCounts.Lambeth=parseInt(this.value)||0;render()"></div>';
  h+='<div><label>+ Other boroughs</label><input type="number" min="0" value="'+provOtherExtra+'" onchange="DATA.provCounts=DATA.provCounts||{Lambeth:0,Southwark:0,Wandsworth:0,Croydon:0};var v=parseInt(this.value)||0;DATA.provCounts.Southwark=v;DATA.provCounts.Wandsworth=0;DATA.provCounts.Croydon=0;render()"></div>';
  h+='</div>';
  if(showProvisional){
    h+='<div class="th-footer" style="margin-top:8px">Projected: <b style="color:'+barColor+'">'+provPct+'%</b> of '+provTotalAll+' total</div>';
  }

  /* Footer info */
  h+='<div class="th-footer">';
  if(lambethOk){h+='Headroom: <b>'+maxNonLambeth+'</b> non-Lambeth referral'+(maxNonLambeth!==1?'s':'');}
  else{var needed=Math.ceil((LAMBETH_MIN/100*total-lambethN)/(1-LAMBETH_MIN/100));h+='Need <b>'+Math.max(needed,1)+'</b> more Lambeth referral'+(needed>1?'s':'');}
  h+='</div>';

  h+='</div>';
  h+='</div>';
  return h;
}
function flagList(r){return(r.flags||'').split(',').map(function(s){return s.trim();}).filter(Boolean);}
function isComplex(r){return flagList(r).indexOf('complex')>=0;}
/* Central flag renderer — call with (r, opts)
   opts.showEmerg = true to include Emergency tag
   opts.showFinal = true to include Final month tag
   Returns HTML string of all applicable tags and dots */
function renderFlags(r,opts){
  opts=opts||{};
  var flags=flagList(r);
  var h='';
  // Sensitive dot flags first (no readable label, tooltip only)
  if(flags.indexOf('dv')>=0)  h+='<span class="flag-dot flag-dot-dv" data-tip="DV / DA — domestic violence" title="DV / DA — domestic violence"></span>';
  if(flags.indexOf('da')>=0)  h+='<span class="flag-dot flag-dot-da" data-tip="D&A — drug & alcohol use" title="D&A — drug & alcohol use"></span>';
  // Text tags
  if(flags.indexOf('complex')>=0)    h+='<span class="flag-tag flag-complex">Complex</span>';
  if(flags.indexOf('disability')>=0) h+='<span class="flag-tag flag-dis">DIS</span>';
  if(flags.indexOf('interpreter')>=0)h+='<span class="flag-tag flag-int">INT</span>';
  if(opts.showEmerg&&r.type==='EMERGENCY') h+='<span class="flag-tag flag-emerg">Emergency</span>';
  if(opts.showFinal&&isFinalMonth(r)) h+='<span class="flag-tag flag-final">Final month</span>';
  return h;
}
function getWelfare(r){if(!r._wf){try{r._wf=JSON.parse(r.welfareJson||'{}')||{};}catch(e){r._wf={};}if(!r._wf.tasks)r._wf.tasks={};}return r._wf;}

function monthsOpen(r){if(r.openFrom&&r.openTo)return r.openFrom+'–'+r.openTo;return '—';}
function fmtDate(s){
  /* Convert stored date strings (e.g. "06 Jan", "06 Jan 2026") to dd/mm/yyyy */
  if(!s)return '—';
  var months={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  var m=s.match(/^(\d{1,2})\s+([A-Za-z]{3})(?:\s+(\d{4}))?$/);
  if(!m)return s;
  var day=m[1].padStart(2,'0');
  var mon=months[m[2]]||'??';
  var yr=m[3]||new Date().getFullYear();
  return day+'/'+mon+'/'+yr;
}
function isFinalMonth(r){return r.openTo&&r.openTo===MONTHS[new Date().getMonth()]&&BENEFICIARY_STATUSES.indexOf(r.status)>=0;}
function statusPill(r){var m=statusMeta(r.status);return '<span class="status-pill '+m.tone+'"><span class="dot"></span>'+esc(r.status)+'</span>';}

/* Tagline for detail page header */
function detailTagline(r){
  var parts=[esc(r.borough),hhWords(r)];
  if(r.openFrom&&r.openTo){
    parts.push('supporting '+esc(r.openFrom)+' – '+esc(r.openTo));
    /* calc months remaining */
    var now=new Date();
    var monthMap={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    var m=r.openTo.match(/^([A-Za-z]{3})\s+(\d{4})$/);
    if(m){
      var endMonth=monthMap[m[1]],endYear=+m[2];
      var diff=(endYear-now.getFullYear())*12+(endMonth-now.getMonth());
      if(diff>0)parts.push(diff+' month'+(diff>1?'s':'')+' remaining');
      else if(diff===0)parts.push('final month');
    }
  }
  return parts.join(' · ');
}

function parseChildAges(agesStr){
  if(!agesStr)return[];
  return String(agesStr).split(',').map(function(s){s=s.trim();var m=s.match(/^(\d+)([MFmf]?)$/);return m?{age:m[1],gender:m[2].toUpperCase()||''}:{age:s,gender:''};});
}
function formatChildren(children,agesStr){
  var count=parseInt(children)||0;
  if(count===0)return 'None';
  var parsed=parseChildAges(agesStr);
  if(!parsed.length)return count+'';
  return parsed.map(function(c){
    var label=c.gender==='M'?'Boy':c.gender==='F'?'Girl':'Child';
    return label+' ('+c.age+')';
  }).join(', ');
}
function calcDistGroup(regDate){
  if(!regDate)return '—';
  var d=parseInt(regDate)||0;
  return d>=1&&d<=14?'Group 1':'Group 2';
